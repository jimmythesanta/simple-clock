<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #000;
        }
        #clock {
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <div id="clock">--:--:--</div>

    <script>
        function tick() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }

        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
